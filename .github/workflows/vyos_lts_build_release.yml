name: VyOS LTS Build

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: "1.4.4"
        description: VyOS version
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: vyos/vyos-build:sagitta
      env:
        TZ: Europe/Rome
      options: --privileged
    env:
      TZ: Europe/Rome
    permissions:
      actions: read
      contents: write

    steps:
      - name: Remove obsolete Debian Buster repositories
        run: |
          set -eux
          # Remove any buster references from sources.list files
          find /etc/apt -name "*.list" -exec grep -l "buster" {} \; | xargs -r rm -f || true
          # Also check live-build config directories
          rm -f /usr/share/live/build/data/debian-cd/buster* || true
          # Update package lists with remaining valid repos
          apt-get update || true

      - name: Download APT key
        run: |
          set -eux
          wget https://vyos.tnyzeq.icu/apt/apt.gpg.key -O /opt/apt.gpg.key

      - name: Git clone vyos-build
        run: |
          set -eux
          git clone -b sagitta --single-branch https://github.com/dd010101/vyos-build.git

      - name: Remove Buster from live-build config
        working-directory: vyos-build
        run: |
          set -eux
          # Find and remove/comment buster references in the build config
          find . -name "*.list.chroot" -exec sed -i "/buster/d" {} \; || true
          find . -name "*.chroot" -exec sed -i "/buster/d" {} \; || true
          # Check for any remaining buster references
          grep -r "buster" data/ || echo "No buster references found in data/"

      - name: Cleanup env
        working-directory: vyos-build
        run: |
          set -eux
          make clean

      - name: Make ISO
        working-directory: vyos-build
        run: |
          set -eux
          ./build-vyos-image iso \
            --architecture amd64 \
            --build-by "${{ github.actor }}@users.noreply.github.com" \
            --build-type release \
            --vyos-mirror "https://vyos.tnyzeq.icu/apt/sagitta" \
            --custom-apt-key /opt/apt.gpg.key \
            --version "${{ inputs.version }}"

      - name: Generate checksums
        run: |
          set -eux
          pwd
          ls -lah
          ls -lah vyos-build/build
          ISOFILE="vyos-build/build/vyos-${{ inputs.version }}-iso-amd64.iso"
          echo "SHA1=$(sha1sum $ISOFILE | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "SHA256=$(sha256sum $ISOFILE | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          name: VyOS ${{ inputs.version }} LTS
          tag_name: ${{ inputs.version }}
          body: |
            VyOS ${{ inputs.version }} LTS
            
            **Checksums:**
            - SHA1: ${{ env.SHA1 }}
            - SHA256: ${{ env.SHA256 }}
          draft: true
          prerelease: true
          files: |
            vyos-build/build/vyos-${{ inputs.version }}-iso-amd64.iso
